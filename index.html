<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>通勤</title>
</head>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    gap: 20px;
}

button {
    width: 80%;
    max-width: 400px;
    height: 80px;
    font-size: 28px;
    border-radius: 16px;
}
</style>

<body>

<h1>通勤アプリ</h1>

<button onclick="company()">出社</button>

<button onclick="home()">帰宅</button>


<script>




function makeYahooUrl(from, to) {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const hh = now.getHours();
  const mm = now.getMinutes();

  const m1 = Math.floor(mm / 10);
  const m2 = mm % 10;

  return `https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&fromgid=&togid=&flatlon=&tlatlon=&via=&viacode=&y=${y}&m=${m}&d=${d}&hh=${hh}&m1=${m1}&m2=${m2}&type=1&ticket=ic&expkind=1&userpass=1&ws=3&s=0&al=1&shin=1&ex=1&hb=1&lb=1&sr=1`;
}

function company() {
  window.location.href = makeYahooUrl("東戸塚", "田町");
}

function home() {
  window.location.href = makeYahooUrl("田町", "東戸塚");
}


</script>

</body>
</html>
