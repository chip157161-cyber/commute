<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>通勤</title>
</head>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    gap: 20px;
}

button {
    width: 80%;
    max-width: 400px;
    height: 80px;
    font-size: 28px;
    border-radius: 16px;
}
</style>

<body>

<h1>通勤アプリ</h1>

<button onclick="tocompany()">出社</button>

<button onclick="fromcompany()">帰宅</button>


<script>
function tocompany() {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const hh = now.getHours();
  const mm = now.getMinutes();

  const m1 = Math.floor(mm / 10);
  const m2 = mm % 10;

  const url =
    `https://transit.yahoo.co.jp/search/result?from=%E6%9D%B1%E6%88%B8%E5%A1%9A&to=%E7%94%B0%E7%94%BA&fromgid=&togid=&flatlon=&tlatlon=&via=&viacode=&y=${y}&m=${m}&d=${d}&hh=${hh}&m1=${m1}&m2=${m2}&type=1&ticket=ic&expkind=1&userpass=1&ws=2&s=0&al=1&shin=1&ex=1&hb=1&lb=1&sr=1`;



  window.location.href = url;
}

function fromcompany() {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const hh = now.getHours();
  const mm = now.getMinutes();

  const m1 = Math.floor(mm / 10);
  const m2 = mm % 10;

  const url =
    `https://transit.yahoo.co.jp/search/result?from=%E7%94%B0%E7%94%BA&to=%E6%9D%B1%E6%88%B8%E5%A1%9A&fromgid=&togid=&flatlon=&tlatlon=&via=&viacode=&y=${y}&m=${m}&d=${d}&hh=${hh}&m1=${m1}&m2=${m2}&type=1&ticket=ic&expkind=1&userpass=1&ws=2&s=0&al=1&shin=1&ex=1&hb=1&lb=1&sr=1`;


  window.location.href = url;
}


</script>

</body>
</html>
