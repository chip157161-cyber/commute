<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>通勤</title>
</head>

<body>

<h1>通勤アプリ</h1>

<button onclick="company()">会社へ</button>

<button>帰宅</button>


<script>
function company() {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const hh = now.getHours();
  const mm = now.getMinutes();

  alert(`${y}/${m}/${d} ${hh}:${mm}`);
}


</script>

</body>
</html>
